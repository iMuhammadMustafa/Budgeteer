name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      eas_build:
        description: "Trigger a native EAS build (preview profile)"
        required: false
        default: false
        type: boolean

# Cancel any in-progress runs on the same ref
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # 0. Full-suite gate (Phase 7.3)
  #    Deploys are blocked until the unit/integration suite AND the full local
  #    E2E journey suite pass on the exact ref being shipped. This is the last
  #    line of defence even though master is already gated by test.yml on push.
  # ──────────────────────────────────────────────
  full-suite:
    name: Full suite (unit + E2E) gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:sqlite (SQLite integration adapter) requires Node ≥22.5.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - name: Vitest (unit + SQLite integration)
        run: npm run test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static web export
        run: npm run web:export
        env:
          EXPO_PUBLIC_SUPA_URL: ${{ secrets.EXPO_PUBLIC_SUPA_URL }}
          EXPO_PUBLIC_SUPA_KEY: ${{ secrets.EXPO_PUBLIC_SUPA_KEY }}
      - name: Run full E2E suite (chromium-local + mobile-smoke)
        run: npx playwright test --project=chromium-local --project=mobile-smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-gate-playwright-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 1. Deploy web app to Vercel
  # ──────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    needs: [full-suite]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. Publish OTA update via EAS Update
  #    Skipped when a native EAS build is requested
  # ──────────────────────────────────────────────
  deploy-eas-update:
    name: EAS Update (OTA)
    needs: [full-suite]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.eas_build == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Publish OTA update
        run: eas update --branch preview --message "${{ github.event.release.tag_name || 'manual deploy' }}" --non-interactive --no-wait

  # ──────────────────────────────────────────────
  # 3. (Optional) Trigger a native EAS Build
  # ──────────────────────────────────────────────
  deploy-eas-build:
    name: EAS Build (Native)
    needs: [full-suite]
    if: github.event_name == 'workflow_dispatch' && inputs.eas_build == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Android (preview)
        run: eas build --platform android --profile preview --non-interactive --no-wait

      # Uncomment when iOS credentials are set up:
      # - name: Build iOS (preview)
      #   run: eas build --platform ios --profile preview --non-interactive
