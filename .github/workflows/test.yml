name: Test

# Phase 7.1/7.2 — layered gate.
#   • PR              → static checks, unit/integration (Vitest), @smoke E2E.
#   • Push to master  → the above + the FULL local E2E suite + cloud/RLS.
#   • Nightly (cron)  → full E2E (local + mobile) + cloud integration/RLS sweep
#                       (security scans run in security.yml, also nightly).
# Blocking: Vitest, E2E-hygiene lint, @smoke E2E, and (on master/nightly) the
# full E2E suite. Advisory: full app lint + typecheck (only pre-existing,
# out-of-scope breakage remains; flip to blocking once cleared).

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC — full E2E + cloud/RLS sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ── Static checks ───────────────────────────────────────────────────────
  static-checks:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: yarn install --frozen-lockfile

      # BLOCKING — E2E hygiene. eslint-plugin-playwright forbids hard waits
      # (no-wait-for-timeout) and force clicks on the active E2E suite. The
      # quarantined legacy specs are lint-ignored (see eslint.config.js).
      - name: ESLint (E2E hygiene, blocking)
        run: npx eslint e2e/

      # ADVISORY — full app lint. The ESLint 10 × eslint-plugin-react crash is
      # FIXED (react version pinned in eslint.config.js). ~21 pre-existing
      # app-code errors remain (set-state-in-effect, refs-in-render, unescaped
      # entities, one orphaned IconPicker) — out of the test-rebuild scope.
      # Flip to blocking once those are cleared.
      - name: ESLint (full, advisory)
        run: npm run lint
        continue-on-error: true

      # ADVISORY — the `dotenv` error is fixed; 3 pre-existing tsc errors remain
      # in the orphaned src/components/elements/IconPicker.tsx (redesign Step-5
      # dereference). Flip to blocking once that orphan is resolved.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

  # ── Unit + integration (BLOCKING) ───────────────────────────────────────
  unit:
    name: Unit + SQLite integration (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:sqlite (used by the SQLite integration adapter) requires Node ≥22.5.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - name: Vitest (default suite; cloud tests self-skip without a stack)
        run: npm run test

  # ── Cloud integration + RLS (local Supabase) ────────────────────────────
  # Heavier; skipped on fork PRs (no ability to run the stack reliably) and only
  # runs on push/dispatch. Proves repo↔PostgREST parity + the RLS attack suite.
  cloud-integration:
    name: Cloud integration + RLS (local Supabase)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: yarn install --frozen-lockfile
      - name: Start local Supabase
        run: supabase start
      - name: Run cloud integration + RLS suites
        run: npm run test:integration:cloud
      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ── E2E smoke (BLOCKING) ────────────────────────────────────────────────
  # The rebuilt Playwright suite (Phase 5.4/5.5): static export + injection
  # harness, fresh context per test, zero hard waits. Runs the @smoke slice on
  # the local SQLite backend + mobile viewport. The playwright.config webServer
  # runs `npm run web:serve` (serves ./dist) automatically. Cloud journeys
  # self-skip without credentials. Legacy specs are quarantined (testIgnore).
  e2e-smoke:
    name: E2E @smoke (local, static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static web export
        run: npm run web:export
        env:
          EXPO_PUBLIC_SUPA_URL: ${{ secrets.EXPO_PUBLIC_SUPA_URL }}
          EXPO_PUBLIC_SUPA_KEY: ${{ secrets.EXPO_PUBLIC_SUPA_KEY }}
      - name: Run @smoke journeys
        run: npx playwright test --grep @smoke --project=chromium-local --project=mobile-smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── E2E full suite (BLOCKING on master + nightly) ───────────────────────
  # The complete journey suite (all specs) on the local SQLite backend + the
  # mobile viewport slice. Too heavy for every PR (the @smoke job covers those);
  # runs on merges to master and the nightly cron. Cloud journeys self-skip
  # without credentials.
  e2e-full:
    name: E2E full suite (local + mobile)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: yarn install --frozen-lockfile
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static web export
        run: npm run web:export
        env:
          EXPO_PUBLIC_SUPA_URL: ${{ secrets.EXPO_PUBLIC_SUPA_URL }}
          EXPO_PUBLIC_SUPA_KEY: ${{ secrets.EXPO_PUBLIC_SUPA_KEY }}
      - name: Run full suite (chromium-local + mobile-smoke)
        run: npx playwright test --project=chromium-local --project=mobile-smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
